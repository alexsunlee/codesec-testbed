apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-113
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: slow-113
  template:
    metadata:
      labels:
        app: slow-113
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
