# IaC fixture - CloudFormation. Same two classes as the Terraform files,
# in a second format, so format coverage is testable independently.
AWSTemplateFormatVersion: "2010-09-09"
Description: codesec-testbed - deliberately misconfigured stack

Resources:
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: codesec-testbed-cfn-artifacts
      AccessControl: PublicRead

  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Deliberately over-permissive
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: far-too-wide
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
