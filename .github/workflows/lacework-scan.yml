# The documented FortiCNAPP CI/CD integration, kept here as a working reference.
# Manual trigger only, so a fixture repository does not burn CI minutes on
# every push. Add LW_ACCOUNT / LW_API_KEY / LW_API_SECRET as repository secrets
# before running it.
name: lacework code scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-latest
    env:
      # subdomain only - no https://, no .lacework.net
      LW_ACCOUNT: ${{ secrets.LW_ACCOUNT }}
      LW_API_KEY: ${{ secrets.LW_API_KEY }}
      LW_API_SECRET: ${{ secrets.LW_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: install the lacework cli and the sca component
        run: |
          curl -sSL https://raw.githubusercontent.com/lacework/go-sdk/main/cli/install.sh | bash
          lacework configure -a "$LW_ACCOUNT" -k "$LW_API_KEY" -s "$LW_API_SECRET" --noninteractive
          lacework component install sca

      - name: scan
        run: lacework sca scan ./ -f lw-json -o /tmp/lacework-scan.json

      - name: upload the raw result as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lacework-scan
          path: /tmp/lacework-scan.json
