# Runs FortiCNAPP Code Security on main and uploads the findings to the
# console. This is the workflow that populates
#   /ui/investigation/codesec/applications/repositories/
#     github.com%2F<owner>%2F<repo>/main
# The PR workflow only comments on the PR - without this one, the repository
# never appears in the Code Security UI at all.
#
# Same secrets as lacework-code-security-pr.yml.
name: lacework code security (push)

on:
  push:
    branches: [main]
  schedule:
    # daily at 07:00 UTC, so the branch view does not go stale
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  LW_ACCOUNT: ${{ secrets.LW_ACCOUNT }}
  LW_SUBACCOUNT: ${{ secrets.LW_SUBACCOUNT }}
  LW_API_KEY: ${{ secrets.LW_API_KEY }}
  LW_API_SECRET: ${{ secrets.LW_API_SECRET }}

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    name: run analysis
    steps:
      - uses: actions/checkout@v4
      - uses: lacework/code-security-action@v1
        with:
          target: push
